<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考核管理后台 · 自媒体实习生考核系统 V2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f172a;
  min-height: 100vh;
  color: #e2e8f0;
  line-height: 1.6;
}

/* ===== 顶部导航 ===== */
.topbar {
  background: #1e293b;
  border-bottom: 1px solid #334155;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 700;
  color: #f1f5f9;
}
.topbar-brand .badge-admin {
  background: #3b82f6;
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.topbar-nav {
  display: flex;
  gap: 4px;
}
.nav-btn {
  padding: 7px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  background: transparent;
  color: #94a3b8;
  transition: all 0.15s;
}
.nav-btn:hover { background: #334155; color: #f1f5f9; }
.nav-btn.active { background: #3b82f6; color: #fff; }

/* ===== 主内容区 ===== */
.main { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

/* ===== 顶部统计卡片 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px 22px;
}
.stat-card .label {
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.stat-card .value {
  font-size: 32px;
  font-weight: 700;
  color: #f1f5f9;
  line-height: 1;
}
.stat-card .sub {
  font-size: 12px;
  color: #64748b;
  margin-top: 6px;
}
.stat-card.blue .value { color: #60a5fa; }
.stat-card.green .value { color: #34d399; }
.stat-card.orange .value { color: #fb923c; }
.stat-card.red .value { color: #f87171; }

/* ===== 面板 ===== */
.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}
.panel-header {
  padding: 18px 24px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-title {
  font-size: 16px;
  font-weight: 700;
  color: #f1f5f9;
}
.panel-body { padding: 0; }

/* ===== 筛选栏 ===== */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 16px 24px;
  border-bottom: 1px solid #1e293b;
  background: #0f172a;
}
.filter-select, .filter-input {
  background: #1e293b;
  border: 1px solid #334155;
  color: #e2e8f0;
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.filter-select:focus, .filter-input:focus {
  outline: none;
  border-color: #3b82f6;
}
.filter-input { min-width: 200px; }

/* ===== 提交记录表格 ===== */
.submissions-table {
  width: 100%;
  border-collapse: collapse;
}
.submissions-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid #334155;
  white-space: nowrap;
}
.submissions-table td {
  padding: 14px 16px;
  font-size: 14px;
  border-bottom: 1px solid #1e293b;
  vertical-align: middle;
}
.submissions-table tr:last-child td { border-bottom: none; }
.submissions-table tr:hover td { background: #0f172a; }

.chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.chip-pending { background: #1e3a5f; color: #60a5fa; }
.chip-graded { background: #064e3b; color: #34d399; }
.chip-pass { background: #064e3b; color: #34d399; }
.chip-fail { background: #450a0a; color: #f87171; }
.chip-first { background: #1e293b; color: #94a3b8; }
.chip-retry { background: #431407; color: #fb923c; }

.score-obj { color: #60a5fa; font-weight: 700; }
.score-essay { color: #fb923c; font-weight: 700; }
.score-final { color: #34d399; font-weight: 700; font-size: 15px; }

.action-btn {
  padding: 5px 12px;
  border: 1px solid #334155;
  border-radius: 5px;
  background: transparent;
  color: #94a3b8;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.action-btn:hover { background: #334155; color: #f1f5f9; border-color: #475569; }
.action-btn.primary { border-color: #3b82f6; color: #60a5fa; }
.action-btn.primary:hover { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

/* ===== 批改详情抽屉 ===== */
.drawer-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
}
.drawer {
  width: min(780px, 100vw);
  background: #1e293b;
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #334155;
}
.drawer-head {
  padding: 20px 24px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: #1e293b;
  z-index: 10;
}
.drawer-head h3 { font-size: 17px; color: #f1f5f9; }
.drawer-close {
  width: 34px; height: 34px;
  border-radius: 6px;
  background: #334155;
  border: none;
  color: #94a3b8;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.drawer-close:hover { background: #475569; color: #f1f5f9; }
.drawer-body { padding: 24px; flex: 1; }

.student-info-bar {
  background: #0f172a;
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 20px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 13px;
}
.student-info-bar span { color: #64748b; }
.student-info-bar strong { color: #e2e8f0; }

.score-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.score-box {
  background: #0f172a;
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.score-box .lbl { font-size: 11px; color: #64748b; margin-bottom: 4px; }
.score-box .num { font-size: 26px; font-weight: 700; }
.score-box.blue .num { color: #60a5fa; }
.score-box.orange .num { color: #fb923c; }
.score-box.green .num { font-size: 30px; color: #34d399; }

/* 题目区域 */
.section-label {
  font-size: 13px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 20px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #334155;
}
.q-block {
  background: #0f172a;
  border-radius: 8px;
  padding: 16px 18px;
  margin-bottom: 12px;
  border-left: 3px solid #334155;
}
.q-block.essay-q { border-left-color: #f59e0b; }
.q-block.correct-q { border-left-color: #34d399; }
.q-block.wrong-q { border-left-color: #f87171; }

.q-text { font-size: 14px; color: #e2e8f0; margin-bottom: 10px; font-weight: 600; }
.q-ans-row { font-size: 13px; margin-bottom: 6px; }
.q-ans-row .lbl { color: #64748b; margin-right: 6px; }
.q-ans-row .val { color: #e2e8f0; }
.q-ans-row .val.good { color: #34d399; }
.q-ans-row .val.bad { color: #f87171; }
.q-ans-row .val.neutral { color: #fb923c; }

.essay-answer-box {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
  color: #e2e8f0;
  white-space: pre-wrap;
  margin: 8px 0;
  line-height: 1.7;
  min-height: 60px;
}
.ref-answer-box {
  background: #0f2a1a;
  border: 1px solid #166534;
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 12px;
  color: #86efac;
  white-space: pre-wrap;
  margin: 8px 0;
  line-height: 1.7;
}
.criteria-box {
  background: #1c1a0a;
  border: 1px solid #713f12;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: #fde68a;
  margin: 6px 0 10px;
}

/* 评分输入 */
.score-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 10px 14px;
}
.score-input-row label { font-size: 13px; color: #94a3b8; white-space: nowrap; }
.score-input {
  width: 80px;
  background: #0f172a;
  border: 1px solid #475569;
  color: #f1f5f9;
  border-radius: 5px;
  padding: 6px 10px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  text-align: center;
}
.score-input:focus { outline: none; border-color: #3b82f6; }
.score-max { font-size: 12px; color: #64748b; }

/* 抽屉底部操作栏 */
.drawer-footer {
  padding: 16px 24px;
  border-top: 1px solid #334155;
  display: flex;
  gap: 12px;
  align-items: center;
  background: #1e293b;
  position: sticky;
  bottom: 0;
}
.grader-input {
  flex: 1;
  background: #0f172a;
  border: 1px solid #334155;
  color: #e2e8f0;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: inherit;
}
.grader-input:focus { outline: none; border-color: #3b82f6; }
.btn-save {
  padding: 9px 20px;
  border: none;
  border-radius: 6px;
  background: #3b82f6;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-save:hover { background: #2563eb; }
.btn-save:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

/* ===== 题目正确率页 ===== */
.accuracy-grid {
  display: grid;
  gap: 20px;
}
.quiz-accuracy-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
}
.quiz-accuracy-header {
  padding: 16px 24px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.quiz-accuracy-header h3 { font-size: 15px; color: #f1f5f9; font-weight: 700; }
.quiz-accuracy-header .meta { font-size: 12px; color: #64748b; }

.question-acc-row {
  padding: 14px 24px;
  border-bottom: 1px solid #1e293b;
  display: grid;
  grid-template-columns: 24px 1fr 120px 60px;
  gap: 12px;
  align-items: center;
}
.question-acc-row:last-child { border-bottom: none; }
.q-num-badge {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #334155;
  color: #94a3b8;
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-short { font-size: 13px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-bar-wrap { position: relative; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; }
.acc-bar { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.acc-bar.high { background: #34d399; }
.acc-bar.mid { background: #fbbf24; }
.acc-bar.low { background: #f87171; }
.acc-pct { font-size: 12px; font-weight: 700; text-align: right; }
.acc-pct.high { color: #34d399; }
.acc-pct.mid { color: #fbbf24; }
.acc-pct.low { color: #f87171; }

/* ===== 空状态 ===== */
.empty-state {
  padding: 60px 24px;
  text-align: center;
  color: #475569;
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; color: #64748b; margin-bottom: 8px; }
.empty-state p { font-size: 14px; }

/* ===== 导入按钮 ===== */
.import-zone {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-import {
  padding: 8px 16px;
  background: #334155;
  border: 1px solid #475569;
  border-radius: 6px;
  color: #e2e8f0;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-import:hover { background: #475569; }
.btn-export-db {
  padding: 8px 16px;
  background: #1d4ed8;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-export-db:hover { background: #2563eb; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  color: #e2e8f0;
  opacity: 0;
  transition: all 0.3s;
  z-index: 9999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: #34d399; color: #34d399; }
.toast.error { border-color: #f87171; color: #f87171; }

input[type="file"] { display: none; }

@media (max-width: 700px) {
  .topbar { padding: 0 16px; }
  .main { padding: 16px 12px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .score-summary { grid-template-columns: repeat(3, 1fr); }
  .question-acc-row { grid-template-columns: 20px 1fr; }
  .question-acc-row .acc-bar-wrap, .question-acc-row .acc-pct { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    📊 考核管理后台
    <span class="badge-admin">ADMIN</span>
  </div>
  <div class="topbar-nav">
    <button class="nav-btn active" id="navSubmissions">📋 提交记录</button>
    <button class="nav-btn" id="navAccuracy">📈 题目正确率</button>
  </div>
</div>

<div class="main" id="app">
  <!-- 内容由 JS 渲染 -->
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept=".json">

<script>
// =============================================
// JSONBin 配置 — 与 index.html 填写一致
// =============================================
const JSONBIN_API_KEY  = '$2a$10$kZCzlXlQ6UAC6oMZJ3/8LucvZU2ldnfhl9llKkZApuNl74cs6gQA6';
const JSONBIN_BIN_ID   = '6a241ec7da38895dfe90df6b';

const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

async function jbGet() {
  try {
    const r = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!r.ok) return null;
    const d = await r.json();
    return d.record;
  } catch(e) { return null; }
}

async function jbSet(data) {
  try {
    const r = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(data)
    });
    return r.ok;
  } catch(e) { return false; }
}

// ============= 状态 =============
let currentPage = 'submissions';
let db = { submissions: [] };
let filterQuiz = '';
let filterGraded = '';
let filterUser = '';
let openDrawerId = null;

// ============= 工具函数 =============
async function loadDB() {
  showToast('正在加载数据...', '');
  const data = await jbGet();
  db = data || { submissions: [] };
}

async function saveDB() {
  return await jbSet(db);
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// ============= 统计 =============
function calcStats() {
  const total = db.submissions.length;
  const graded = db.submissions.filter(s => s.graded).length;
  const pending = total - graded;
  const users = new Set(db.submissions.map(s => s.user)).size;
  return { total, graded, pending, users };
}

// ============= 渲染主页面 =============
async function render() {
  await loadDB();
  const app = document.getElementById('app');
  const stats = calcStats();

  const statsHtml = `
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="label">总提交数</div>
        <div class="value">${stats.total}</div>
        <div class="sub">来自 ${stats.users} 位实习生</div>
      </div>
      <div class="stat-card orange">
        <div class="label">待批改</div>
        <div class="value">${stats.pending}</div>
        <div class="sub">简答题未评分</div>
      </div>
      <div class="stat-card green">
        <div class="label">已批改</div>
        <div class="value">${stats.graded}</div>
        <div class="sub">简答题已完成评分</div>
      </div>
      <div class="stat-card">
        <div class="label">参与人数</div>
        <div class="value">${stats.users}</div>
        <div class="sub">不同考生</div>
      </div>
    </div>`;

  if (currentPage === 'submissions') {
    app.innerHTML = statsHtml + renderSubmissionsPage();
  } else {
    app.innerHTML = statsHtml + renderAccuracyPage();
  }

  bindEvents();
}

// ============= 提交记录页 =============
function renderSubmissionsPage() {
  // 筛选
  let filtered = db.submissions.filter(s => {
    if (filterQuiz && s.quizKey !== filterQuiz) return false;
    if (filterGraded === 'pending' && s.graded) return false;
    if (filterGraded === 'graded' && !s.graded) return false;
    if (filterUser && !s.user.includes(filterUser)) return false;
    return true;
  });

  // 按提交时间倒序
  filtered = filtered.slice().sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

  const quizOptions = [
    { key:'', label:'所有考核' },
    { key:'quiz1', label:'小考1：底层认知' },
    { key:'quiz2', label:'小考2：工具+对标' },
    { key:'quiz3', label:'小考3：账号规划' },
    { key:'quiz4', label:'小考4：实操综合' },
    { key:'finalExam', label:'结业大考' },
  ];

  const filterHtml = `
    <div class="filter-bar">
      <select class="filter-select" id="filterQuiz">
        ${quizOptions.map(o => `<option value="${o.key}" ${filterQuiz===o.key?'selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="filter-select" id="filterGraded">
        <option value="" ${filterGraded===''?'selected':''}>全部状态</option>
        <option value="pending" ${filterGraded==='pending'?'selected':''}>待批改</option>
        <option value="graded" ${filterGraded==='graded'?'selected':''}>已批改</option>
      </select>
      <input class="filter-input" id="filterUser" type="text" placeholder="搜索姓名…" value="${escapeHtml(filterUser)}">
    </div>`;

  if (filtered.length === 0) {
    return `<div class="panel">
      <div class="panel-header">
        <span class="panel-title">📋 提交记录（${filtered.length}）</span>
        ${renderImportExport()}
      </div>
      ${filterHtml}
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>暂无提交记录</h3>
        <p>实习生完成考试后，记录会自动出现在这里（同一浏览器）<br>或通过"导入 JSON"导入其他设备的数据</p>
      </div>
    </div>`;
  }

  const rows = filtered.map(s => {
    const hasEssay = s.detail && s.detail.essay && s.detail.essay.length > 0;
    const essaySpace = s.totalScore - s.maxObjective;
    const finalScore = s.graded ? (s.objectiveScore + (s.essayTotal || 0)) : null;
    const gradedChip = s.graded
      ? `<span class="chip chip-graded">已批改</span>`
      : (hasEssay ? `<span class="chip chip-pending">待批改</span>` : `<span class="chip chip-graded">自动完成</span>`);
    const attemptChip = s.attemptType === 'retry'
      ? `<span class="chip chip-retry">补考</span>`
      : `<span class="chip chip-first">首考</span>`;

    const passLine = s.quizKey === 'finalExam' ? 80 : 90;
    const scoreDisplay = finalScore !== null
      ? `<span class="score-final">${finalScore}</span><span style="color:#475569;font-size:11px"> /${s.totalScore}</span>`
      : `<span class="score-obj">${s.objectiveScore}</span><span style="color:#475569;font-size:12px"> +${hasEssay ? '?' : 0}主观</span>`;

    return `<tr>
      <td style="font-weight:600;color:#f1f5f9">${escapeHtml(s.user)}</td>
      <td style="color:#94a3b8;font-size:13px">${escapeHtml(s.quizTitle)}</td>
      <td>${attemptChip}</td>
      <td>${scoreDisplay}</td>
      <td>${gradedChip}</td>
      <td style="color:#64748b;font-size:12px">${fmtDate(s.submittedAt)}</td>
      <td style="color:#64748b;font-size:12px">${s.duration ? formatTime(s.duration) : '-'}</td>
      <td>
        <button class="action-btn primary" onclick="openDrawer('${s.id}')">
          ${s.graded ? '查看详情' : (hasEssay ? '📝 去批改' : '查看')}
        </button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="panel">
    <div class="panel-header">
      <span class="panel-title">📋 提交记录（${filtered.length} / ${db.submissions.length}）</span>
      ${renderImportExport()}
    </div>
    ${filterHtml}
    <div class="panel-body" style="overflow-x:auto">
      <table class="submissions-table">
        <thead>
          <tr>
            <th>姓名</th>
            <th>考核名称</th>
            <th>类型</th>
            <th>得分</th>
            <th>状态</th>
            <th>提交时间</th>
            <th>用时</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderImportExport() {
  return `<div class="import-zone">
    <button class="btn-import" onclick="document.getElementById('importFileInput').click()">📂 导入 JSON</button>
    <button class="btn-export-db" onclick="exportDB()">💾 导出数据库</button>
  </div>`;
}

// ============= 批改抽屉 =============
function openDrawer(id) {
  openDrawerId = id;
  const s = db.submissions.find(x => x.id === id);
  if (!s) return;

  const hasEssay = s.detail && s.detail.essay && s.detail.essay.length > 0;
  const essaySpace = s.totalScore - s.maxObjective;
  const currentEssayTotal = s.essayTotal || 0;
  const currentFinal = s.objectiveScore + currentEssayTotal;

  // 客观题详情
  let objHtml = '';
  if (s.detail && s.detail.choice && s.detail.choice.length) {
    objHtml += `<div class="section-label">选择题 · ${s.detail.choice.filter(d=>d.correct).length} / ${s.detail.choice.length} 题正确</div>`;
    s.detail.choice.forEach((d, i) => {
      const cls = d.correct ? 'correct-q' : 'wrong-q';
      objHtml += `<div class="q-block ${cls}">
        <div class="q-text">${i+1}. ${escapeHtml(d.q)}</div>
        <div class="q-ans-row"><span class="lbl">考生答案：</span><span class="val ${d.correct?'good':'bad'}">${escapeHtml(d.userAns||'未作答')} ${d.correct?'✓':'✗'}</span></div>
        <div class="q-ans-row"><span class="lbl">正确答案：</span><span class="val">${escapeHtml(d.correctAns)}</span><span style="margin-left:12px;font-size:12px;color:#64748b">得分 ${d.score}</span></div>
      </div>`;
    });
  }
  if (s.detail && s.detail.fill && s.detail.fill.length) {
    objHtml += `<div class="section-label">填空题 · 自动判分</div>`;
    s.detail.fill.forEach((d, i) => {
      const cls = d.fullCorrect ? 'correct-q' : (d.partial > 0 ? 'q-block' : 'wrong-q');
      objHtml += `<div class="q-block ${cls}">
        <div class="q-text">${i+1}. ${escapeHtml(d.q)}</div>
        <div class="q-ans-row"><span class="lbl">考生答案：</span><span class="val neutral">${escapeHtml(d.userAns||'未作答')}</span></div>
        <div class="q-ans-row"><span class="lbl">参考答案：</span><span class="val" style="color:#94a3b8">${escapeHtml(d.correctAns)}</span></div>
        <div class="q-ans-row"><span class="lbl">自动得分：</span><span class="val ${d.fullCorrect?'good':'neutral'}">${d.partial||0} / ${d.scoreMax}</span></div>
      </div>`;
    });
  }

  // 简答题批改
  let essayHtml = '';
  if (hasEssay) {
    essayHtml += `<div class="section-label">简答题 · 待手动评分（满分 ${essaySpace} 分）</div>`;
    s.detail.essay.forEach((d, i) => {
      const savedScore = s.essayScores && s.essayScores[d.qid] !== undefined ? s.essayScores[d.qid] : '';
      essayHtml += `<div class="q-block essay-q">
        <div class="q-text">${i+1}. ${escapeHtml(d.q)}</div>
        <div class="q-ans-row" style="margin-bottom:4px"><span class="lbl">考生作答：</span></div>
        <div class="essay-answer-box">${d.userAns ? escapeHtml(d.userAns) : '<em style="color:#475569">（未作答）</em>'}</div>
        <div class="q-ans-row" style="margin-bottom:4px"><span class="lbl">参考答案：</span></div>
        <div class="ref-answer-box">${escapeHtml(d.refAns || '')}</div>
        ${d.scoringCriteria ? `<div class="criteria-box">📐 评分细则：${escapeHtml(d.scoringCriteria)}</div>` : ''}
        <div class="score-input-row">
          <label>本题评分：</label>
          <input class="score-input essay-score-input" type="number" min="0" max="${d.scoreMax}" step="0.5"
            data-qid="${d.qid}" data-max="${d.scoreMax}"
            value="${savedScore}"
            placeholder="0"
          >
          <span class="score-max">/ ${d.scoreMax} 分</span>
        </div>
      </div>`;
    });
  }

  const drawerHtml = `<div class="drawer-bg" id="drawerBg" onclick="handleDrawerBgClick(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-head">
        <h3>批改详情 · ${escapeHtml(s.user)} · ${escapeHtml(s.quizTitle)}</h3>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-body">
        <div class="student-info-bar">
          <div><span>姓名 </span><strong>${escapeHtml(s.user)}</strong></div>
          <div><span>考核 </span><strong>${escapeHtml(s.quizTitle)}</strong></div>
          <div><span>类型 </span><strong>${s.attemptType==='retry'?'补考':'首考'}</strong></div>
          <div><span>提交 </span><strong>${fmtDate(s.submittedAt)}</strong></div>
          <div><span>用时 </span><strong>${s.duration?formatTime(s.duration):'-'}</strong></div>
        </div>
        <div class="score-summary">
          <div class="score-box blue">
            <div class="lbl">客观题得分</div>
            <div class="num">${s.objectiveScore}<span style="font-size:14px;color:#475569"> /${s.maxObjective}</span></div>
          </div>
          <div class="score-box orange">
            <div class="lbl">简答题得分</div>
            <div class="num" id="drawerEssayTotal">${currentEssayTotal}<span style="font-size:14px;color:#475569"> /${essaySpace}</span></div>
          </div>
          <div class="score-box green">
            <div class="lbl">综合总分</div>
            <div class="num" id="drawerFinalScore">${currentFinal}<span style="font-size:14px;color:#475569"> /${s.totalScore}</span></div>
          </div>
        </div>
        ${objHtml}
        ${essayHtml}
      </div>
      <div class="drawer-footer">
        <input class="grader-input" id="graderName" placeholder="批改人姓名（选填）" value="${escapeHtml(s.gradedBy||'')}">
        <button class="btn-save" id="saveGradeBtn" onclick="saveGrade('${id}')">
          ${s.graded ? '✓ 更新评分' : '💾 保存评分'}
        </button>
      </div>
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', drawerHtml);

  // 监听分数输入，实时更新汇总
  document.querySelectorAll('.essay-score-input').forEach(input => {
    input.addEventListener('input', updateDrawerTotal);
  });
}

function updateDrawerTotal() {
  const s = db.submissions.find(x => x.id === openDrawerId);
  if (!s) return;
  const essaySpace = s.totalScore - s.maxObjective;
  let total = 0;
  document.querySelectorAll('.essay-score-input').forEach(input => {
    const val = parseFloat(input.value) || 0;
    const max = parseFloat(input.dataset.max) || 0;
    total += Math.min(val, max);
  });
  const el = document.getElementById('drawerEssayTotal');
  const fEl = document.getElementById('drawerFinalScore');
  if (el) el.innerHTML = `${total}<span style="font-size:14px;color:#475569"> /${essaySpace}</span>`;
  if (fEl) fEl.innerHTML = `${s.objectiveScore + total}<span style="font-size:14px;color:#475569"> /${s.totalScore}</span>`;
}

async function saveGrade(id) {
  const s = db.submissions.find(x => x.id === id);
  if (!s) return;
  const graderName = document.getElementById('graderName').value.trim();
  const essayScores = {};
  let essayTotal = 0;
  let allFilled = true;
  document.querySelectorAll('.essay-score-input').forEach(input => {
    const qid = input.dataset.qid;
    const max = parseFloat(input.dataset.max) || 0;
    const val = input.value === '' ? null : Math.min(parseFloat(input.value) || 0, max);
    if (val === null) { allFilled = false; return; }
    essayScores[qid] = val;
    essayTotal += val;
  });
  if (!allFilled) {
    showToast('请填写所有简答题的分数', 'error');
    return;
  }
  s.essayScores = essayScores;
  s.essayTotal = essayTotal;
  s.finalScore = s.objectiveScore + essayTotal;
  s.graded = true;
  s.gradedBy = graderName;
  s.gradedAt = new Date().toISOString();
  showToast('正在保存...', '');
  const ok = await saveDB();
  closeDrawer();
  if (ok) {
    showToast(`✓ 已保存 ${s.user} 的评分，总分 ${s.finalScore}/${s.totalScore}`, 'success');
  } else {
    showToast('保存失败，请重试', 'error');
  }
  render();
}

function closeDrawer() {
  const bg = document.getElementById('drawerBg');
  if (bg) bg.remove();
  openDrawerId = null;
}

function handleDrawerBgClick(e) {
  if (e.target.id === 'drawerBg') closeDrawer();
}

// ============= 题目正确率页 =============
function renderAccuracyPage() {
  const quizMeta = [
    { key:'quiz1', title:'小考 1：底层认知' },
    { key:'quiz2', title:'小考 2：工具 + 选题对标' },
    { key:'quiz3', title:'小考 3：账号规划 + 注册 + 养号' },
    { key:'quiz4', title:'小考 4：产出 / 审核 / 发布 / 导流' },
    { key:'finalExam', title:'结业大考：综合' },
  ];

  if (db.submissions.length === 0) {
    return `<div class="panel"><div class="empty-state">
      <div class="icon">📊</div>
      <h3>暂无数据</h3>
      <p>等有考生提交后，这里会自动显示每道题的正确率</p>
    </div></div>`;
  }

  // 按考核分组，统计每道题的正确率
  const html = quizMeta.map(quiz => {
    const subs = db.submissions.filter(s => s.quizKey === quiz.key);
    if (subs.length === 0) return '';

    // 统计选择题
    const choiceStats = {}; // qid -> {correct:0, total:0, text:''}
    const fillStats = {};
    subs.forEach(s => {
      if (s.detail && s.detail.choice) {
        s.detail.choice.forEach(d => {
          if (!choiceStats[d.qid]) choiceStats[d.qid] = { correct:0, total:0, text: d.q };
          choiceStats[d.qid].total++;
          if (d.correct) choiceStats[d.qid].correct++;
        });
      }
      if (s.detail && s.detail.fill) {
        s.detail.fill.forEach(d => {
          if (!fillStats[d.qid]) fillStats[d.qid] = { full:0, partial:0, total:0, text: d.q };
          fillStats[d.qid].total++;
          if (d.fullCorrect) fillStats[d.qid].full++;
          else if (d.partial > 0) fillStats[d.qid].partial++;
        });
      }
    });

    let rowsHtml = '';
    let qIdx = 0;
    Object.entries(choiceStats).forEach(([qid, stat]) => {
      qIdx++;
      const pct = stat.total ? Math.round(stat.correct / stat.total * 100) : 0;
      const cls = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';
      rowsHtml += `<div class="question-acc-row">
        <div class="q-num-badge">${qIdx}</div>
        <div class="q-short" title="${escapeHtml(stat.text)}">${escapeHtml(stat.text.substring(0,50))}${stat.text.length>50?'…':''}</div>
        <div class="acc-bar-wrap"><div class="acc-bar ${cls}" style="width:${pct}%"></div></div>
        <div class="acc-pct ${cls}">${pct}%</div>
      </div>`;
    });
    Object.entries(fillStats).forEach(([qid, stat]) => {
      qIdx++;
      const pct = stat.total ? Math.round(stat.full / stat.total * 100) : 0;
      const cls = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';
      rowsHtml += `<div class="question-acc-row">
        <div class="q-num-badge">${qIdx}</div>
        <div class="q-short" title="${escapeHtml(stat.text)}">[填空] ${escapeHtml(stat.text.substring(0,45))}${stat.text.length>45?'…':''}</div>
        <div class="acc-bar-wrap"><div class="acc-bar ${cls}" style="width:${pct}%"></div></div>
        <div class="acc-pct ${cls}">${pct}%</div>
      </div>`;
    });

    // 计算平均分
    const avgObj = subs.length ? Math.round(subs.reduce((sum,s)=>sum+s.objectiveScore,0) / subs.length) : 0;

    return `<div class="quiz-accuracy-card">
      <div class="quiz-accuracy-header">
        <h3>${escapeHtml(quiz.title)}</h3>
        <div class="meta">共 ${subs.length} 份 · 客观题平均分 <strong style="color:#60a5fa">${avgObj}</strong></div>
      </div>
      ${rowsHtml || '<div style="padding:20px 24px;color:#475569;font-size:13px">暂无客观题数据</div>'}
    </div>`;
  }).join('');

  return `<div class="accuracy-grid">${html}</div>`;
}

// ============= 导出 =============
function exportDB() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '考核数据库_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('importFileInput').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      const imported = JSON.parse(evt.target.result);
      if (!imported.submissions) throw new Error('格式错误');
      imported.submissions.forEach(s => {
        const existIdx = db.submissions.findIndex(x => x.id === s.id);
        if (existIdx >= 0) {
          if (!db.submissions[existIdx].graded && s.graded) {
            db.submissions[existIdx] = s;
          }
        } else {
          db.submissions.push(s);
        }
      });
      showToast('正在保存到云端...', '');
      await saveDB();
      showToast(`✓ 导入成功，共 ${imported.submissions.length} 条记录`, 'success');
      render();
    } catch(err) {
      showToast('导入失败：JSON 格式错误', 'error');
    }
  };
  reader.readAsText(file);
  this.value = '';
});

// ============= 事件绑定 =============
function bindEvents() {
  document.getElementById('navSubmissions').addEventListener('click', () => {
    currentPage = 'submissions';
    document.getElementById('navSubmissions').classList.add('active');
    document.getElementById('navAccuracy').classList.remove('active');
    render();
  });
  document.getElementById('navAccuracy').addEventListener('click', () => {
    currentPage = 'accuracy';
    document.getElementById('navAccuracy').classList.add('active');
    document.getElementById('navSubmissions').classList.remove('active');
    render();
  });

  const fq = document.getElementById('filterQuiz');
  if (fq) fq.addEventListener('change', e => { filterQuiz = e.target.value; render(); });
  const fg = document.getElementById('filterGraded');
  if (fg) fg.addEventListener('change', e => { filterGraded = e.target.value; render(); });
  const fu = document.getElementById('filterUser');
  if (fu) fu.addEventListener('input', e => { filterUser = e.target.value.trim(); render(); });
}

// ============= 初始化 =============
render();
// 每 60 秒自动刷新（减少 API 消耗）
setInterval(() => { if (document.visibilityState === 'visible' && !openDrawerId) render(); }, 60000);
</script>
